<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Full-site Video Background -->
  <div class="bg-video-wrapper">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="images_videos/background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Site Content Container -->
  <div class="site-content">

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="logo">GIRAFFE<span>9</span>STUDIO</a>
    <nav>
      <ul class="nav-list">
        <li><a href="index.html">首頁</a></li>
        <li><a href="works.html">案例介紹</a></li>
        <li><a href="about.html">關於我們</a></li>
        <li><a href="contact.html">聯絡我們</a></li>
      </ul>
    </nav>
    <div class="menu-toggle" aria-label="開啟選單" role="button" tabindex="0">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <section class="section">
      <h1 class="section-title">聯絡我們</h1>
      <p class="section-subtitle">有任何想法或需求，歡迎與我們聊聊</p>

      <div class="contact-wrapper">
        <div class="contact-info">
          <h3>聯繫方式</h3>
          <p>📧 Email: hello@giraffe9studio.com</p>
          <p>📱 Phone: (請填入電話)</p>
          <p>📍 Location: (請填入地址)</p>
          <br>
          <h3>社群媒體</h3>
          <p>Instagram: @giraffe9studio</p>
          <p>Facebook: Giraffe 9 Studio</p>
        </div>

        <form class="contact-form" action="#" method="POST">
          <input type="text" name="name" placeholder="您的姓名" required aria-label="姓名">
          <input type="email" name="email" placeholder="Email 信箱" required aria-label="Email">
          <input type="text" name="subject" placeholder="主旨" aria-label="主旨">
          <textarea name="message" placeholder="請簡述您的需求或想法..." required aria-label="訊息內容"></textarea>
          <button type="submit" class="btn">送出訊息</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Giraffe 9 Studio. All rights reserved.</p>
  </footer>

  </div><!-- /.site-content -->

  <script src="js/main.js"></script>
