<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giraffe 9 Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Full-site Video Background -->
  <div class="bg-video-wrapper">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="images_videos/background.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="header-logo">
      <img src="images_videos/logo_white.svg" alt="Giraffe 9 Studio" width="120" height="40">
    </a>
    <nav class="header-nav">
      <a href="works.html">Project</a>
      <a href="about.html">About us</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="menu-toggle" aria-label="開啟選單">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Site Content Container -->
  <div class="site-content">

    <!-- Banner -->
    <section class="banner">
      <video class="banner-video" autoplay muted loop playsinline>
        <source src="images_videos/banner.mp4" type="video/mp4">
      </video>
      <div class="banner-grid-wrapper">
        <div class="banner-grid">
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
          <div class="banner-grid-item"></div>
        </div>
      </div>
    </section>

    <!-- Services Section -->
    <section class="services">
      <h2 class="services-title">Services We Render</h2>
      <p class="services-subtitle">我們提供的服務</p>

      <div class="services-grid">
        <!-- Row 1: circle + circle + pill -->
        <div class="service-item-wrapper circle-wrapper">
          <div class="service-item circle">
            <img src="images_videos/block_a/block_a_01.jpg" alt="UI Design" class="service-img default">
            <img src="images_videos/block_a/block_a_01_color.jpg" alt="UI Design" class="service-img hover">
          </div>
          <h3 class="service-name">UI Design</h3>
          <p class="service-desc">創造提升使用體驗的完美外觀</p>
        </div>
        <div class="service-item-wrapper circle-wrapper">
          <div class="service-item circle">
            <img src="images_videos/block_a/block_a_02.jpg" alt="UX Design" class="service-img default">
            <img src="images_videos/block_a/block_a_02_color.jpg" alt="UX Design" class="service-img hover">
          </div>
          <h3 class="service-name">UX Design</h3>
          <p class="service-desc">創造客戶與產品間的優良互動體驗</p>
        </div>
        <div class="service-item-wrapper pill-wrapper">
          <div class="service-item pill">
            <img src="images_videos/block_a/block_a_03.jpg" alt="Prototyping" class="service-img default">
            <img src="images_videos/block_a/block_a_03_color.jpg" alt="Prototyping" class="service-img hover">
          </div>
          <h3 class="service-name">Prototyping</h3>
          <p class="service-desc">開發前深度探索、優化您的產品</p>
        </div>

        <!-- Row 2: circle + pill + circle -->
        <div class="service-item-wrapper circle-wrapper">
          <div class="service-item circle">
            <img src="images_videos/block_a/block_a_04.jpg" alt="Content-Strategy" class="service-img default">
            <img src="images_videos/block_a/block_a_04_color.jpg" alt="Content-Strategy" class="service-img hover">
          </div>
          <h3 class="service-name">Content-Strategy</h3>
          <p class="service-desc">提高用戶使用率的内容創意與規劃</p>
        </div>
        <div class="service-item-wrapper pill-wrapper">
          <div class="service-item pill">
            <img src="images_videos/block_a/block_a_05.jpg" alt="Branding" class="service-img default">
            <img src="images_videos/block_a/block_a_05_color.jpg" alt="Branding" class="service-img hover">
          </div>
          <h3 class="service-name">Branding</h3>
          <p class="service-desc">通過客製化的樣式、字體設計、圖標和動畫，使產品脫穎而出</p>
        </div>
        <div class="service-item-wrapper circle-wrapper">
          <div class="service-item circle">
            <img src="images_videos/block_a/block_a_06.jpg" alt="Interaction Design" class="service-img default">
            <img src="images_videos/block_a/block_a_06_color.jpg" alt="Interaction Design" class="service-img hover">
          </div>
          <h3 class="service-name">Interaction Design</h3>
          <p class="service-desc">透過簡單直觀的方式組織產品內容</p>
        </div>
      </div>
    </section>

    <!-- Portfolio Grid -->
    <div class="portfolio-grid-wrapper">
      <section class="portfolio-grid">
        <div class="portfolio-item">
          <img src="images_videos/block_b/01.jpg" alt="作品 1" class="portfolio-img default">
          <img src="images_videos/block_b/01_hover.jpg" alt="作品 1" class="portfolio-img hover">
        </div>
        <div class="portfolio-item">
          <img src="images_videos/block_b/02.jpg" alt="作品 2" class="portfolio-img default">
          <img src="images_videos/block_b/02_hover.jpg" alt="作品 2" class="portfolio-img hover">
        </div>
        <div class="portfolio-item portfolio-text">
          <div class="portfolio-text-content">
            <h3>Our Project</h3>
            <p>幫助您測試您的想法，並在不犧牲品質的前提下將您的產品推向市場。</p>
          </div>
        </div>
        <div class="portfolio-item">
          <img src="images_videos/block_b/04.jpg" alt="作品 4" class="portfolio-img default">
          <img src="images_videos/block_b/04_hover.jpg" alt="作品 4" class="portfolio-img hover">
        </div>
        <div class="portfolio-item group-a">
          <img src="images_videos/block_b/05.jpg" alt="作品 5" class="portfolio-img default">
          <img src="images_videos/block_b/05_hover.jpg" alt="作品 5" class="portfolio-img hover">
        </div>
        <div class="portfolio-item group-a">

        </div>
        <div class="portfolio-item group-b">
          <img src="images_videos/block_b/07.jpg" alt="作品 7" class="portfolio-img default">
          <img src="images_videos/block_b/07_hover.jpg" alt="作品 7" class="portfolio-img hover">
        </div>
        <div class="portfolio-item group-b">
          <img src="images_videos/block_b/08.jpg" alt="作品 8" class="portfolio-img default">
          <img src="images_videos/block_b/08_hover.jpg" alt="作品 8" class="portfolio-img hover">
        </div>
        <div class="portfolio-item">
          <img src="images_videos/block_b/09.jpg" alt="作品 9" class="portfolio-img default">
          <img src="images_videos/block_b/09_hover.jpg" alt="作品 9" class="portfolio-img hover">
        </div>
        <div class="portfolio-item group-c">
          <img src="images_videos/block_b/10.jpg" alt="作品 10" class="portfolio-img default">
          <img src="images_videos/block_b/10_hover.jpg" alt="作品 10" class="portfolio-img hover">
        </div>
        <div class="portfolio-item group-c">
          <img src="images_videos/block_b/11.jpg" alt="作品 11" class="portfolio-img default">
          <img src="images_videos/block_b/11_hover.jpg" alt="作品 11" class="portfolio-img hover">
        </div>
        <div class="portfolio-item">
          <img src="images_videos/block_b/12.jpg" alt="作品 12" class="portfolio-img default">
          <img src="images_videos/block_b/12_hover.jpg" alt="作品 12" class="portfolio-img hover">
        </div>
      </section>
    </div>

  </div>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>

  <script src="js/main.js?v=2"></script>
</body>
</html>
